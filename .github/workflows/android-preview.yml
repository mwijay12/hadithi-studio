name: Android preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/7fa735da-hadithi-studio'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Run Flutter tests
        shell: bash
        run: |
          set -o pipefail
          if ! timeout 90s flutter test --concurrency=1 --reporter expanded test/home_activities_test.dart test/reader_layout_test.dart test/similar_stories_test.dart test/local_review_test.dart test/smart_resume_test.dart test/reading_activity_test.dart test/reading_rewards_test.dart 2>&1 | tee /tmp/flutter-test.log; then
            message=$(grep -A 20 'EXCEPTION CAUGHT' /tmp/flutter-test.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::$message"
            exit 1
          fi
          if ! flutter test --reporter expanded 2>&1 | tee /tmp/flutter-suite.log; then
            message=$(tail -100 /tmp/flutter-suite.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::$message"
            exit 1
          fi
      - name: Configure memory for CI
        run: |
          sed -i 's/-Xmx1024m/-Xmx3g/' android/gradle.properties
          sed -i 's/android.enableJetifier=true/android.enableJetifier=false/' android/gradle.properties
      - name: Build test APK
        shell: bash
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee /tmp/apk-build.log; then
            message=$(tail -60 /tmp/apk-build.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::$message"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hadithi-studio-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
