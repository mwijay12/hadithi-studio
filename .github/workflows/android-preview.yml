name: Android preview APK
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Retrieve existing tested APK
        uses: actions/download-artifact@v4
        with:
          name: hadithi-studio-test-apk
          path: transfer
          run-id: 45339996710
          github-token: ${{ github.token }}
      - name: Stage temporary APK chunks for Drive transfer
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const data = fs.readFileSync('transfer/app-release.apk');
            const hashes = [];
            for (let offset = 0; offset < data.length; offset += 6 * 1024 * 1024) {
              const chunk = data.subarray(offset, offset + 6 * 1024 * 1024);
              const result = await github.rest.git.createBlob({owner: context.repo.owner, repo: context.repo.repo, content: chunk.toString('base64'), encoding: 'base64'});
              hashes.push(result.data.sha);
            }
            core.warning('TRANSFER_APK size=' + data.length + ' sha256=' + crypto.createHash('sha256').update(data).digest('hex') + ' chunks=' + hashes.join(','));
