# Kumbukumbu ya Gradle.
#
# Template ya Flutter huweka `-Xmx4G`. Kwenye mazingira yenye RAM 4GB
# (na ~1.8GB inayopatikana), daemon huuawa na mfumo wakati wa assembleDebug —
# ndiyo kosa "Gradle build daemon disappeared unexpectedly". 1536m inatosha
# kwa build ya debug.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
